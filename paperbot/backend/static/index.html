<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #080c14;
        --surface: #0f1724;
        --surface2: #161f2e;
        --border: rgba(255, 255, 255, 0.08);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --text: #f0f4ff;
        --text-muted: #8892a4;
        --accent: #4f8ef7;
        --accent-hover: #7aaaff;
        --tag-bg: rgba(79, 142, 247, 0.12);
        --tag-border: rgba(79, 142, 247, 0.3);
        color-scheme: dark;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        overflow-x: hidden;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
        background: none;
        border: none;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .particle-canvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      .site-shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }

      /* ── Navbar ── */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 6vw;
        background: rgba(8, 12, 20, 0.88);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
      }

      .logo {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
        white-space: nowrap;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .nav-links a:hover {
        color: var(--text);
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        transition: background 0.15s;
      }

      .cta:hover {
        background: var(--accent-hover);
      }

      /* ── Shared button styles ── */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 13px 28px;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: background 0.15s;
      }

      .btn-primary:hover {
        background: var(--accent-hover);
      }

      .ghost-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        padding: 12px 24px;
        font-size: 0.9rem;
        font-weight: 500;
        transition: border-color 0.15s, color 0.15s;
      }

      .ghost-btn:hover {
        border-color: rgba(255, 255, 255, 0.3);
        color: #fff;
      }

      /* ── Eyebrow / label ── */
      .eyebrow,
      .label {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      /* ── Hero ── */
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 96px 6vw 72px;
      }

      .hero .eyebrow {
        margin-bottom: 28px;
      }

      .hero h1 {
        font-size: clamp(3.5rem, 8vw, 7rem);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1.0;
        color: var(--text);
        max-width: 860px;
      }

      .hero-sub {
        margin-top: 24px;
        max-width: 540px;
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .hero-buttons {
        display: flex;
        gap: 12px;
        margin-top: 36px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero-stats {
        display: flex;
        align-items: center;
        margin-top: 64px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .hero-stats-item {
        padding: 0 20px;
      }

      .hero-stats-item:first-child {
        padding-left: 0;
      }

      .hero-stats-item:last-child {
        padding-right: 0;
      }

      .hero-stats-divider {
        width: 1px;
        height: 14px;
        background: rgba(255, 255, 255, 0.14);
        flex-shrink: 0;
      }

      /* ── Sections ── */
      .section {
        padding: 96px 6vw;
        background: var(--bg);
        border-top: 1px solid var(--border-subtle);
      }

      .section-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 32px;
        margin-bottom: 48px;
      }

      .section .label {
        margin-bottom: 12px;
        display: block;
      }

      .section h2 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
        letter-spacing: -0.028em;
        color: var(--text);
        margin-top: 0;
      }

      .section-copy {
        max-width: 400px;
        color: var(--text-muted);
        line-height: 1.65;
        font-size: 0.92rem;
        margin: 0;
      }

      /* ── Feature Grid 2×2 ── */
      .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .feature-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 28px;
        background: var(--surface);
      }

      .feature-icon {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--accent);
        margin-bottom: 16px;
      }

      .feature-card h3 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.015em;
        margin-bottom: 9px;
      }

      .feature-card p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.6;
        font-size: 0.875rem;
      }

      /* ── Papers List ── */
      .paper-list {
        display: flex;
        flex-direction: column;
      }

      .paper-row {
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 22px 0;
        border-bottom: 1px solid var(--border-subtle);
      }

      .paper-row:first-child {
        border-top: 1px solid var(--border-subtle);
      }

      .paper-num {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--accent);
        min-width: 26px;
        flex-shrink: 0;
      }

      .paper-info {
        flex: 1;
        min-width: 0;
      }

      .paper-title {
        font-size: 0.975rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .paper-desc {
        margin-top: 4px;
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      .paper-tag {
        display: inline-flex;
        align-items: center;
        flex-shrink: 0;
        background: var(--tag-bg);
        border: 1px solid var(--tag-border);
        color: var(--accent);
        border-radius: 999px;
        padding: 5px 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.65rem;
        font-weight: 500;
        white-space: nowrap;
      }

      /* ── Footer ── */
      .footer {
        padding: 28px 6vw 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border-top: 1px solid var(--border-subtle);
        background: var(--bg);
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      /* ── Health badge ── */
      .health-badge {
        position: fixed;
        left: 24px;
        bottom: 24px;
        z-index: 25;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 14px;
        background: var(--surface);
        color: var(--text-muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.66rem;
        font-weight: 500;
      }

      .health-badge[data-status="ok"] {
        color: #4ade80;
      }

      .health-badge[data-status="offline"] {
        color: #f87171;
      }

      /* ── Chat launcher ── */
      .chat-launcher {
        position: fixed;
        right: 26px;
        bottom: 26px;
        z-index: 40;
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        box-shadow: 0 0 0 0 rgba(79, 142, 247, 0.35), 0 6px 24px rgba(79, 142, 247, 0.28);
        transition: background 0.15s, box-shadow 0.2s;
      }

      .chat-launcher:hover {
        background: var(--accent-hover);
        box-shadow: 0 0 0 8px rgba(79, 142, 247, 0.12), 0 6px 24px rgba(79, 142, 247, 0.38);
      }

      /* ── Chat panel ── */
      .chat-panel {
        position: fixed;
        right: 26px;
        bottom: 96px;
        z-index: 39;
        width: min(560px, calc(100vw - 52px));
        height: min(720px, calc(100vh - 120px));
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface);
      }

      .chat-header {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .chat-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .chat-title {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .online-indicator {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.64rem;
        font-weight: 500;
        color: #4ade80;
        letter-spacing: 0.04em;
      }

      .icon-btn {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text-muted);
        background: transparent;
        transition: color 0.15s, border-color 0.15s;
      }

      .icon-btn:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.18);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .messages::-webkit-scrollbar {
        width: 4px;
      }

      .messages::-webkit-scrollbar-track {
        background: transparent;
      }

      .messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      .message-row {
        display: flex;
        margin: 0;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .bubble {
        max-width: 86%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        background: var(--surface2);
        color: var(--text);
        line-height: 1.5;
        font-size: 0.875rem;
      }

      .message-row.user .bubble {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .source-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        row-gap: 6px;
        margin-top: 10px;
      }

      .meta-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: var(--tag-bg);
        border: 1px solid var(--tag-border);
        color: var(--accent);
        border-radius: 999px;
        padding: 4px 10px;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 0;
      }

      .suggestion-message {
        margin-top: -4px;
      }

      .suggestion-bubble {
        background: rgba(79, 142, 247, 0.06);
        border-color: rgba(79, 142, 247, 0.18);
        padding: 10px 14px;
      }

      .suggestion-label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 8px;
        font-family: "Inter", system-ui, sans-serif;
      }

      .suggestion-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .suggestion-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(79, 142, 247, 0.1);
        border: 1px solid rgba(79, 142, 247, 0.3);
        color: var(--accent);
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.78rem;
        font-weight: 500;
        font-family: "Inter", system-ui, sans-serif;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      .suggestion-btn:hover {
        background: rgba(79, 142, 247, 0.2);
        border-color: rgba(79, 142, 247, 0.5);
      }

      .chat-form {
        display: flex;
        gap: 10px;
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .chat-input {
        flex: 1;
        min-width: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: #0a1020;
        color: var(--text);
        padding: 10px 16px;
        outline: none;
        font-size: 0.875rem;
      }

      .chat-input::placeholder {
        color: var(--text-muted);
      }

      .chat-input:focus {
        border-color: rgba(79, 142, 247, 0.45);
      }

      .send-btn {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        transition: background 0.15s;
      }

      .send-btn:hover {
        background: var(--accent-hover);
      }

      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Typing dots */
      .typing {
        display: flex;
        gap: 5px;
        align-items: center;
        height: 16px;
      }

      .typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        animation: dot-bounce 0.9s infinite ease-in-out;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.12s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.24s;
      }

      @keyframes dot-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      /* Interrupt card */
      .interrupt-card {
        width: 94%;
        border: 1px solid rgba(79, 142, 247, 0.2);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        padding: 14px;
        background: rgba(79, 142, 247, 0.08);
      }

      .interrupt-title {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-family: "Inter", system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .interrupt-card p {
        color: var(--text-muted);
        margin: 8px 0 12px;
        line-height: 1.5;
        font-size: 0.835rem;
      }

      .interrupt-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .gold-btn {
        display: inline-flex;
        align-items: center;
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.15s;
      }

      .gold-btn:hover {
        background: var(--accent-hover);
      }

      /* Image display */
      .inline-image {
        max-width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        display: block;
        cursor: zoom-in;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        padding: 28px;
        background: rgba(3, 8, 15, 0.92);
        backdrop-filter: blur(8px);
      }

      .image-modal {
        position: relative;
        max-width: min(1100px, 94vw);
        max-height: 88vh;
      }

      .image-modal img {
        max-width: 100%;
        max-height: 88vh;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .modal-close {
        position: absolute;
        top: -16px;
        right: -16px;
      }

      /* ── Responsive ── */
      @media (max-width: 860px) {
        .feature-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .nav {
          padding: 0 20px;
        }

        .nav-links {
          display: none;
        }

        .hero {
          padding: 80px 20px 60px;
        }

        .section {
          padding: 64px 20px;
        }

        .section-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }

        .paper-row {
          flex-wrap: wrap;
          gap: 12px;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
          padding: 24px 20px 100px;
        }

        .chat-panel {
          left: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          height: 88vh;
          border-radius: 16px 16px 0 0;
        }

        .chat-launcher {
          right: 18px;
          bottom: 18px;
        }

        .health-badge {
          left: 18px;
          bottom: 18px;
        }
      }

      @media (max-width: 480px) {
        .hero-buttons {
          flex-direction: column;
          align-items: center;
          width: 100%;
        }

        .btn-primary,
        .ghost-btn {
          width: 100%;
          max-width: 280px;
        }

        .hero-stats {
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
          margin-top: 44px;
        }

        .hero-stats-divider {
          display: none;
        }

        .hero-stats-item {
          padding: 0;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CYtxQ2bj.js"></script>

  </head>
  <body>
    <canvas id="particle-bg" class="particle-canvas"></canvas>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </body>
</html>
